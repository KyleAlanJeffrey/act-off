<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dub-Off</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <!-- Fonts are self-hosted (src/app/fonts.css + public/fonts/): no
         fonts.googleapis.com / fonts.gstatic.com connections, which stall
         first paint on iPhone Safari (partitioned cache + cellular RTT).
         The icon font is subset to exactly the icons the app uses — adding
         a new <Icon name="…"> means regenerating it (see fonts.css header).
         Preload the latin text slices + icons so they fetch alongside CSS. -->
    <link rel="preload" href="/fonts/text-4.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/text-2.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/icons-0.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
